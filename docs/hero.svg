<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">PocketQuota — 像管理 Agent 一样管理自己的消费习惯</title>
  <desc id="desc">深色科技风产品介绍插画：每日额度、日常池与灵活池。所示数字为虚构演示。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#1c1832"/></linearGradient>
    <linearGradient id="spectrum"><stop stop-color="#9572ff"/><stop offset=".6" stop-color="#7c9bff"/><stop offset="1" stop-color="#66daec"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#292337"/><stop offset="1" stop-color="#1a1b23"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7962ff" stop-opacity=".18"/><stop offset="1" stop-color="#7962ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <ellipse cx="988" cy="220" rx="390" ry="310" fill="url(#halo)"/>
  <g fill="none" stroke="#a6a0ce" stroke-opacity=".055"><path d="M640 0v480M720 0v480M800 0v480M880 0v480M960 0v480M1040 0v480M1120 0v480M1200 0v480M640 80h640M640 160h640M640 240h640M640 320h640M640 400h640"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="62" y="50" width="38" height="38" rx="11" fill="url(#spectrum)"/>
    <path d="M72 61h18v10c0 6-9 10-9 10s-9-4-9-10Z" fill="#181426"/>
    <path d="M77 67h8m-8 5h5" stroke="#cdc6ff" stroke-width="2" stroke-linecap="round"/>
    <text x="114" y="78" fill="#f5f4fa" font-size="28" font-weight="650" letter-spacing="-.7">PocketQuota</text>
    <text x="62" y="184" fill="#f4f2ff" font-size="45" font-weight="600" letter-spacing="-1.2">像管理 Agent 一样</text>
    <text x="62" y="246" fill="#f4f2ff" font-size="45" font-weight="600" letter-spacing="-1.2">管理自己的消费习惯。</text>
    <text x="64" y="298" fill="#aaa7bf" font-size="19">每日额度 · 自动预算 · 对话记账</text>
    <rect x="64" y="347" width="247" height="39" rx="19.5" fill="#a58bff" fill-opacity=".1" stroke="#a58bff" stroke-opacity=".22"/>
    <circle cx="84" cy="367" r="4" fill="#a994ff"/>
    <text x="100" y="373" fill="#d6cfff" font-size="14">你与 Agent，共用同一本账</text>
    <g transform="translate(706 52)">
      <rect width="510" height="257" rx="21" fill="#080810" fill-opacity=".18" transform="translate(0 10)"/>
      <rect width="510" height="257" rx="21" fill="url(#card)" stroke="#514766" stroke-opacity=".6"/>
      <text x="30" y="43" fill="#e2deef" font-size="17">今日可用额度</text>
      <circle cx="476" cy="37" r="4" fill="#aa91ff"/>
      <text x="29" y="123" fill="#a4a0b5" font-size="27">¥</text>
      <text x="54" y="123" fill="#f4f3fa" font-size="67" font-weight="500" letter-spacing="-3">28.50</text>
      <text x="31" y="163" fill="#aaa6bc" font-size="13">¥28.50 / ¥60.00</text>
      <text x="478" y="163" fill="#d2ccdf" font-size="13" text-anchor="end">47.5%</text>
      <rect x="30" y="183" width="450" height="20" rx="10" fill="#34313e"/>
      <rect x="30" y="183" width="214" height="20" rx="10" fill="url(#spectrum)"/>
      <g fill="#9dbafc"><circle cx="250" cy="176" r="2" opacity=".9"/><circle cx="263" cy="166" r="1.5" opacity=".6"/><circle cx="250" cy="155" r="1" opacity=".4"/><circle cx="273" cy="184" r="1" opacity=".4"/></g>
      <text x="31" y="232" fill="#848091" font-size="11">每日额度</text>
      <text x="479" y="232" fill="#848091" font-size="11" text-anchor="end">00:00 ↻</text>
      <g transform="translate(0 279)">
        <rect width="246" height="96" rx="17" fill="#20202b" stroke="#3c354d"/>
        <circle cx="26" cy="28" r="4" fill="#a383ff"/>
        <text x="39" y="33" fill="#b8b2c9" font-size="13">日常池</text>
        <text x="23" y="73" fill="#eeeaf7" font-size="28" font-weight="500">¥1,768.50</text>
        <rect x="264" width="246" height="96" rx="17" fill="#20202b" stroke="#3c354d"/>
        <circle cx="290" cy="28" r="4" fill="#6ac9ed"/>
        <text x="303" y="33" fill="#b8b2c9" font-size="13">灵活池</text>
        <text x="287" y="73" fill="#eeeaf7" font-size="28" font-weight="500">¥360.00</text>
      </g>
    </g>
  </g>
</svg>
